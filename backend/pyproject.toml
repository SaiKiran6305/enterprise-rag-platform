[project]
name = "backend"
version = "0.1.0"
description = "Private, cited document question answering"
readme = "README.md"
authors = [
    { name = "SaiKiran6305", email = "saikirandasari6305@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.141.1",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.18.1",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "openai>=2.0,<3",
    "PyJWT>=2.10,<3",
    "pwdlib[argon2]>=0.3,<1",
    "redis>=6,<8",
    "rq>=2,<3",
    "tiktoken>=0.11,<1",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["integration: requires PostgreSQL and Redis"]
