name: CI
on:
  push:
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg17-bookworm
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.12.18
      - run: uv sync --frozen
      - run: uv run alembic -c src/app/alembic.ini upgrade head
        env:
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
      - run: uv run pytest -q
        env:
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
          DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          TEST_DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379/0
      - run: uv run alembic -c src/app/alembic.ini upgrade head --sql > /tmp/migration.sql
        env:
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build api web
        env:
          DOMAIN: example.com
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: test
          OPENAI_API_KEY: placeholder-ci-key
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
